name: Montar e Transmitir Vídeo

on:
  workflow_dispatch:
    inputs:
      id:
        description: 'ID do evento/live'
        required: true
        type: string

      video_principal:
        description: 'Caminho do vídeo principal no Drive (ex: videos/abc.mp4)'
        required: true
        type: string

      rodape_id:
        description: 'Caminho do rodapé (opcional)'
        required: false
        type: string

      rodape_texto:
        description: 'Texto ao lado do rodapé'
        required: false
        type: string

      videos_extras:
        description: 'Caminhos extras separados por vírgula'
        required: false
        type: string

      stream_url:
        description: 'URL do RTMP (opcional)'
        required: false
        type: string

      rclone_conf:
        description: 'rclone.conf codificado em base64'
        required: true
        type: string

jobs:
  montar-video:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 📦 Instalar dependências
        run: |
          sudo apt update
          sudo apt install -y ffmpeg jq rclone
          echo '{}' > package.json
          npm install puppeteer

      - name: 📄 Salvar rclone.conf (decodificado)
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ inputs.rclone_conf }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: 📄 Criar sacredi.json a partir do segredo
        run: echo '${{ secrets.SACREDI_JSON }}' > sacredi.json

      - name: 🔍 Mostrar sacredi.json no log
        run: |
          echo "Conteúdo de sacredi.json:"
          cat sacredi.json
          echo "--- FIM ---"

      - name: 🧾 Processar vídeos extras (array JSON)
        id: extras
        run: |
          if [ -z "${{ inputs.videos_extras }}" ]; then
            echo "VIDEOS_EXTRAS_JSON=[]" >> "$GITHUB_ENV"
          else
            IFS=',' read -ra EXTRAS <<< "${{ inputs.videos_extras }}"
            JSON=$(printf '%s\n' "${EXTRAS[@]}" | jq -R . | jq -s .)
            echo "VIDEOS_EXTRAS_JSON=$JSON" >> "$GITHUB_ENV"
          fi

      - name: 📝 Gerar input.json para o Node.js
        run: |
          jq -n \
            --arg id "${{ inputs.id }}" \
            --arg video_principal "${{ inputs.video_principal }}" \
            --arg rodape_id "${{ inputs.rodape_id }}" \
            --arg rodape_texto "${{ inputs.rodape_texto }}" \
            --arg stream_url "${{ inputs.stream_url }}" \
            --argjson videos_extras "$VIDEOS_EXTRAS_JSON" \
            --slurpfile sacredi sacredi.json \
          '{
            id: $id,
            video_principal: $video_principal,
            video_inicial: $sacredi[0].video_inicial,
            video_miraplay: $sacredi[0].video_miraplay,
            video_final: $sacredi[0].video_final,
            logo_id: $sacredi[0].logo_id,
            rodape_id: $rodape_id,
            rodape_texto: $rodape_texto,
            videos_extras: $videos_extras,
            stream_url: $stream_url
          }' > input.json

      - name: 📂 Mostrar input.json no log
        run: cat input.json

      - name: 🧠 Executar script de montagem Node.js
        run: node unir.js

      - name: 📤 Salvar artefatos finais
        uses: actions/upload-artifact@v4
        with:
          name: video_final
          path: |
            video_final_completo.mp4
            stream_info.json
            rodape.mp4

  transmitir-video:
    runs-on: ubuntu-latest
    needs: montar-video

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 📦 Instalar dependências
        run: |
          sudo apt update
          sudo apt install -y ffmpeg
          echo '{}' > package.json
          npm install puppeteer

      - name: 📂 Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          name: video_final
          path: video_final

      - name: 🧾 Copiar para diretório atual
        run: cp -r video_final/* .

      - name: ▶️ Transmitir vídeo final (Node)
        env:
          SERVER_STATUS_URL: ${{ secrets.SERVER_STATUS_URL }}
        run: node transmitir.js
