name: Montar e Transmitir Vídeo

on:
  workflow_dispatch:
    inputs:
      id:
        description: 'ID do evento/live'
        required: true
        type: string

      video_principal:
        description: 'ID do vídeo principal no Google Drive'
        required: true
        type: string

      rodape_id:
        description: 'ID do arquivo rodapé (.webm) no Google Drive'
        required: false
        type: string

      rodape_texto:
        description: 'Texto que será exibido ao lado do rodapé'
        required: false
        type: string

      videos_extras:
        description: 'IDs dos vídeos extras separados por vírgula (máx. 5)'
        required: false
        type: string

      stream_url:
        description: 'URL para onde será enviado o vídeo final (RTMP ou outro)'
        required: false
        type: string

      rclone_conf:
        description: 'Conteúdo do rclone.conf codificado em base64'
        required: true
        type: string

jobs:
  montar-video:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 📦 Instalar dependências
        run: |
          sudo apt update
          sudo apt install -y ffmpeg jq rclone
          echo '{}' > package.json
          npm install puppeteer

      - name: 📄 Criar configuração do rclone (decodificar base64)
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ inputs.rclone_conf }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: 🐛 Debug: exibir rclone.conf
        run: cat ~/.config/rclone/rclone.conf

      - name: 📄 Criar arquivo sacredi.json a partir do segredo base64
        run: |
          echo "${{ secrets.SACREDI_BASE64 }}" | base64 -d > sacredi.json
          echo "📄 Conteúdo decodificado de sacredi.json:"
          cat sacredi.json
          echo "--- FIM ---"

      - name: 📥 Baixar rodapé com rclone (se existir)
        if: ${{ inputs.rodape_id != '' && inputs.rodape_id != null }}
        run: |
          mkdir -p artefatos
          rclone copy meudrive:${{ inputs.rodape_id }} artefatos/

      - name: 📄 Processar videos_extras e criar extras.json
        run: |
          if [ -z "${{ inputs.videos_extras }}" ]; then
            echo "[]" > extras.json
          else
            IFS=',' read -ra EXTRAS <<< "${{ inputs.videos_extras }}"
            printf '%s\n' "${EXTRAS[@]}" | jq -R . | jq -s . > extras.json
          fi
          echo "Extras processados:"
          cat extras.json

      - name: 📄 Criar input.json para script node
        run: |
          jq -n \
            --arg id "${{ inputs.id }}" \
            --arg video_principal "${{ inputs.video_principal }}" \
            --arg rodape_id "${{ inputs.rodape_id }}" \
            --arg rodape_texto "${{ inputs.rodape_texto }}" \
            --arg stream_url "${{ inputs.stream_url }}" \
            --slurpfile sacredi sacredi.json \
            --slurpfile extras extras.json \
            '{
              id: $id,
              video_principal: $video_principal,
              video_inicial: $sacredi[0].video_inicial,
              video_miraplay: $sacredi[0].video_miraplay,
              video_final: $sacredi[0].video_final,
              logo_id: $sacredi[0].logo_id,
              rodape_id: $rodape_id,
              rodape_texto: $rodape_texto,
              videos_extras: $extras[0],
              stream_url: $stream_url
            }' > input.json
          echo "📄 Conteúdo de input.json:"
          cat input.json

      - name: 🧠 Executar script de montagem (Node.js)
        run: node unir.js

      - name: 📤 Salvar vídeo final e artefatos
        uses: actions/upload-artifact@v4
        with:
          name: video_final
          path: |
            video_final_completo.mp4
            stream_info.json
            artefatos/rodape.webm

  transmitir-video:
    runs-on: ubuntu-latest
    needs: montar-video

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 📦 Instalar dependências para transmissão
        run: |
          sudo apt update
          sudo apt install -y ffmpeg
          echo '{}' > package.json
          npm install puppeteer

      - name: 📄 Baixar artifact com vídeo e stream_info
        uses: actions/download-artifact@v4
        with:
          name: video_final
          path: video_final

      - name: 📂 Copiar arquivos para diretório atual
        run: cp -r video_final/* .

      - name: 📝 Listar arquivos (debug opcional)
        run: ls -la

      - name: ▶️ Transmitir vídeo final (.mp4) com rodapé
        env:
          SERVER_STATUS_URL: ${{ secrets.SERVER_STATUS_URL }}
        run: node transmitir.js
