name: Montar e Transmitir Vídeo

on:
  workflow_dispatch:
    inputs:
      id:
        description: 'ID do evento/live'
        required: true
        type: string

      video_principal:
        description: 'Caminho do vídeo principal (ex: videos/abc123.mp4)'
        required: true
        type: string

      rodape_id:
        description: 'Caminho do arquivo rodapé (.webm/mp4)'
        required: false
        type: string

      rodape_texto:
        description: 'Texto exibido ao lado do rodapé'
        required: false
        type: string

      videos_extras:
        description: 'Caminhos dos vídeos extras, separados por vírgula (máx. 5)'
        required: false
        type: string

      stream_url:
        description: 'URL RTMP para envio do vídeo final'
        required: false
        type: string

      rclone_conf:
        description: 'Conteúdo do rclone.conf em base64'
        required: true
        type: string

jobs:
  montar-video:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 📦 Instalar dependências
        run: |
          sudo apt update
          sudo apt install -y ffmpeg jq rclone
          echo '{}' > package.json
          npm install puppeteer

      - name: 🔐 Criar rclone.conf (a partir do base64)
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ inputs.rclone_conf }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: 🧾 Criar sacredi.json a partir do segredo
        run: |
          echo '${{ secrets.SACREDI_JSON }}' > sacredi.json

      - name: 📥 Baixar rodapé (se fornecido)
        if: ${{ inputs.rodape_id != '' && inputs.rodape_id != null }}
        run: |
          mkdir -p artefatos
          rclone copy meudrive:${{ inputs.rodape_id }} artefatos/

      - name: 📄 Criar input.json com todos os dados corretamente
        run: |
          if [ -z "${{ inputs.videos_extras }}" ]; then
            VIDEOS_EXTRAS_JSON='[]'
          else
            IFS=',' read -ra EXTRAS_ARRAY <<< "${{ inputs.videos_extras }}"
            VIDEOS_EXTRAS_JSON=$(printf '%s\n' "${EXTRAS_ARRAY[@]}" | jq -R . | jq -s .)
          fi

          jq -n \
            --arg id "${{ inputs.id }}" \
            --arg video_principal "${{ inputs.video_principal }}" \
            --arg rodape_id "${{ inputs.rodape_id }}" \
            --arg rodape_texto "${{ inputs.rodape_texto }}" \
            --arg stream_url "${{ inputs.stream_url }}" \
            --argjson videos_extras "$VIDEOS_EXTRAS_JSON" \
            --slurpfile sacredi sacredi.json \
          '{
            id: $id,
            video_principal: $video_principal,
            video_inicial: $sacredi[0].video_inicial,
            video_miraplay: $sacredi[0].video_miraplay,
            video_final: $sacredi[0].video_final,
            logo_id: $sacredi[0].logo_id,
            rodape_id: $rodape_id,
            rodape_texto: $rodape_texto,
            videos_extras: $videos_extras,
            stream_url: $stream_url
          }' > input.json

      - name: 🧠 Executar script de montagem
        run: node unir.js

      - name: 📤 Salvar artefatos (vídeo final e dados)
        uses: actions/upload-artifact@v4
        with:
          name: video_final
          path: |
            video_final_completo.mp4
            stream_info.json
            artefatos/

  transmitir-video:
    runs-on: ubuntu-latest
    needs: montar-video

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 📦 Instalar dependências para transmissão
        run: |
          sudo apt update
          sudo apt install -y ffmpeg
          echo '{}' > package.json
          npm install puppeteer

      - name: 📄 Baixar artifact com vídeo e metadados
        uses: actions/download-artifact@v4
        with:
          name: video_final
          path: video_final

      - name: 📂 Copiar arquivos para diretório atual
        run: cp -r video_final/* .

      - name: ▶️ Transmitir vídeo final (.mp4)
        env:
          SERVER_STATUS_URL: ${{ secrets.SERVER_STATUS_URL }}
        run: node transmitir.js
